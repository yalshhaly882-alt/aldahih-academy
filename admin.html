<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>لوحة التحكم — Al-Dahih Academy</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">🛠️</span> لوحة التحكم</div>
  <button class="icon-btn" id="logout-btn" style="display:none">خروج</button>
</div>

<div class="wrap">

  <!-- تسجيل الدخول -->
  <div id="admin-login">
    <div class="panel" style="margin-top:40px;">
      <div class="admin-badge">🔒 دخول الإدارة فقط</div>
      <form id="admin-login-form">
        <div class="field">
          <label for="admin-email">الإيميل</label>
          <input type="email" id="admin-email" autocomplete="off" />
        </div>
        <div class="field">
          <label for="admin-password">كلمة المرور</label>
          <input type="password" id="admin-password" autocomplete="off" />
        </div>
        <div id="admin-login-error" style="color:var(--danger); font-size:13.5px; margin-bottom:10px;"></div>
        <button type="submit" class="btn">دخول</button>
      </form>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="admin-panel" style="display:none">

    <h2 style="margin-bottom:16px;">⚙️ إعدادات رسالة الترحيب والدعم</h2>
    <div class="panel">
      <form id="site-settings-form">
        <div class="field">
          <label for="f-welcome-title">عنوان الترحيب</label>
          <input type="text" id="f-welcome-title" />
        </div>
        <div class="field">
          <label for="f-welcome-text">نص الترحيب</label>
          <input type="text" id="f-welcome-text" />
        </div>
        <div class="field">
          <label for="f-support-username">يوزر الدعم الفني على تليجرام (من غير @)</label>
          <input type="text" id="f-support-username" />
        </div>
        <button type="submit" class="btn">💾 حفظ إعدادات الموقع</button>
      </form>
    </div>

    <div class="divider"></div>

    <h2 style="margin-bottom:16px;">👥 الطلاب المسجلين</h2>
    <div class="panel">
      <div class="field" style="margin-bottom:14px;">
        <label for="students-search">بحث بالاسم</label>
        <input type="text" id="students-search" placeholder="اكتب اسم للبحث..." />
      </div>
      <div id="students-count" style="color:var(--text-muted); font-size:13.5px; margin-bottom:10px;"></div>
      <div id="students-list"></div>
    </div>

    <div class="divider"></div>

    <h2 style="margin-bottom:16px;">📚 مواد كل شعبة</h2>
    <div class="panel">
      <p style="color:var(--text-muted); font-size:14px; margin-bottom:14px;">اضغط على المادة عشان تفعّلها أو تلغيها للشعبة</p>
      <div id="subject-picker"></div>
      <button type="button" id="save-groups-btn" class="btn btn-outline">💾 حفظ مواد الشعب</button>
    </div>

    <div class="divider"></div>

    <h2 style="margin-bottom:16px;">📺 روابط المدرسين</h2>
    <div class="panel">
      <div class="field">
        <label for="teacher-subject-select">اختار المادة</label>
        <select id="teacher-subject-select" style="width:100%; padding:13px 15px; border-radius:10px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); font-family:'Cairo',sans-serif;"></select>
      </div>

      <div id="teacher-list" style="margin-bottom:18px;"></div>

      <form id="add-teacher-form" class="row-2">
        <div class="field">
          <label for="new-teacher-name">اسم المدرس</label>
          <input type="text" id="new-teacher-name" />
        </div>
        <div class="field">
          <label for="new-teacher-link">رابط القناة/المحاضرات</label>
          <input type="url" id="new-teacher-link" />
        </div>
        <div style="grid-column: 1 / -1;">
          <button type="submit" class="btn">➕ إضافة مدرس</button>
        </div>
      </form>

      <button type="button" id="save-teachers-btn" class="btn btn-outline">💾 حفظ روابط المدرسين</button>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module" src="admin.js"></script>
<script>
  document.getElementById("logout-btn").style.display = "inline-block";
</script>
</body>
</html>
